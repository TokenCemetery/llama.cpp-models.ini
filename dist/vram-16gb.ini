; gpt-oss-20b - OpenAI open-weight reasoning MoE
; repo: unsloth/gpt-oss-20b-GGUF
; docs: https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
; OpenAI's recommended sampling: temp 1.0 / top-p 1.0 / top-k 0
;   (top-k 100 is also worth trying per Unsloth)
; reasoning-effort: low | medium | high
; quant for this tier: Q6_K  (~12.2 GiB)
[gpt-oss-20b]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 1.0
top-k = 0

; Qwen3.5-0.8B - Small series, multimodal, hybrid reasoning, 256K max context
; repo: unsloth/Qwen3.5-0.8B-GGUF
; docs: https://unsloth.ai/docs/models/qwen3.5
; The Small series ships with thinking DISABLED by default, so the values below
; are Qwen's Instruct (non-thinking) general-task settings.
;   Enable thinking:  chat-template-kwargs = {"enable_thinking":true}
;   then switch to:   temp 1.0 / top-p 0.95 / presence-penalty 1.5
; quant for this tier: Q6_K  (~2.1 GiB)
[qwen3.5-0.8b]
ctx-size = 32768
n-gpu-layers = 99
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0


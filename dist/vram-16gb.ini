version = 1

; llama.cpp router preset - 16 GB VRAM profile
;
; GENERATED by src/build.py - do not edit.
; Edit configs/<provider>/<model>.ini and re-run: python3 src/build.py
;
; Models are located by --models-dir. Each section name must exactly match a
; subdirectory under that root; no paths appear in this file. See README.md.
;
;   llama-server --models-dir /path/to/models \
;                --models-preset dist/vram-16gb.ini \
;                --host 127.0.0.1 --port 8080
;
; Download the quant listed below into the matching directory. Figures are
; gguf-parser estimates at ctx-size 32768, flash-attn on, q8_0 K/V cache,
; full GPU offload, with 1 GiB reserved for the OS/display.
;
;   gemma-4-12b-it      Q6_K           11.2 GiB   (unsloth)
;   gemma-4-26b-a4b-it  UD-Q3_K_XL     14.0 GiB   (unsloth)
;   gemma-4-e2b-it      Q6_K            3.3 GiB   (unsloth)
;   gemma-4-e4b-it      Q6_K            5.4 GiB   (unsloth)
;   gpt-oss-20b         Q6_K           12.2 GiB   (unsloth)
;   qwen3.5-0.8b        Q6_K            2.1 GiB   (unsloth)
;   qwen3.5-2b          Q6_K            2.9 GiB   (unsloth)
;   qwen3.5-4b          Q6_K            5.1 GiB   (unsloth)
;   qwen3.5-9b          Q6_K            8.0 GiB   (unsloth)
;   qwen3.8-27b         UD-Q3_K_XL     14.2 GiB   (unsloth)
;

[*]
stop-timeout = 30
cache-prompt = true
jinja = true
flash-attn = auto
cache-type-k = q8_0
cache-type-v = q8_0
reasoning-format = auto


; Gemma 4 12B-it - unified text/image/audio, hybrid thinking, 256K max context
; repo: unsloth/gemma-4-12B-it-GGUF
; docs: https://unsloth.ai/docs/models/gemma-4
; Google's recommended sampling: temp 1.0 / top-p 0.95 / top-k 64
; mmproj-*.gguf and mtp-*.gguf in the model directory are wired up automatically.
; quant for this tier: Q6_K  (~11.2 GiB)
[gemma-4-12b-it]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64

; Gemma 4 26B-A4B-it - sparse MoE (4B active), multimodal, hybrid thinking
; repo: unsloth/gemma-4-26B-A4B-it-GGUF
; docs: https://unsloth.ai/docs/models/gemma-4
; Google's recommended sampling: temp 1.0 / top-p 0.95 / top-k 64
; mmproj-*.gguf and mtp-*.gguf in the model directory are wired up automatically.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.
; quant for this tier: UD-Q3_K_XL  (~14.0 GiB)
[gemma-4-26b-a4b-it]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64


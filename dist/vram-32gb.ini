n-gpu-layers = 99
reasoning = on
reasoning-effort = medium
temp = 1.0
top-p = 1.0
top-k = 0

; NVIDIA Nemotron 3.5 Lightning 30B-A3B - hybrid reasoning MoE (3B active),
; built for high-volume agent loops: tool use, validation, subagent delegation
; repo: unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
; docs: https://unsloth.ai/docs/models/nemotron-3.5
; NVIDIA's recommended sampling (thinking): temp 0.6 / top-p 0.95 / min-p 0.01
;   Instruct mode instead uses temp 0.2.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.
; quant for this tier: UD-Q5_K_XL  (~29.0 GiB)
[nvidia-nemotron-3.5-lightning-30b-a3b]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
temp = 0.6
top-p = 0.95
min-p = 0.01

; Qwen3.5-0.8B - Small series, multimodal, hybrid reasoning, 256K max context
; repo: unsloth/Qwen3.5-0.8B-GGUF
; docs: https://unsloth.ai/docs/models/qwen3.5
; The Small series ships with thinking DISABLED by default, so the values below
; are Qwen's Instruct (non-thinking) general-task settings.
;   Enable thinking:  chat-template-kwargs = {"enable_thinking":true}
;   then switch to:   temp 1.0 / top-p 0.95 / presence-penalty 1.5
; quant for this tier: Q6_K  (~2.1 GiB)
[qwen3.5-0.8b]
ctx-size = 32768
n-gpu-layers = 99
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0


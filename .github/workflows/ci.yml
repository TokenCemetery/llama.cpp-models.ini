name: CI

# Runs on branches and pull requests. Pushes to main are covered by release.yml,
# which runs the same checks before publishing.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      # Covers the output-stability invariants: the estimates file must
      # round-trip byte-identically, or every measurement run rewrites it.
      - name: Test
        run: make test

      - name: Build dist/
        run: make build

      # Checks every rule in AGENTS.md, including that each key is one llama.cpp
      # actually accepts. An unknown key makes llama-server exit 1 at startup, so
      # this catches the same failure without needing the binary.
      - name: Validate configs
        run: make validate

      # MODELS.md is generated but committed, so it can be browsed on GitHub.
      - name: Check MODELS.md is up to date
        run: |
          if ! git diff --quiet -- MODELS.md; then
            echo "::error::MODELS.md is stale. Run 'make build' and commit the result."
            git --no-pager diff -- MODELS.md
            exit 1
          fi

      # dist/ is generated, not committed. Upload it so reviewers can see what a
      # change to configs/ actually produces.
      - name: Upload generated presets
        uses: actions/upload-artifact@v4
        with:
          name: presets
          path: dist/*.ini
          if-no-files-found: error

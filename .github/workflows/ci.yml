name: CI

# Runs on branches and pull requests. Pushes to main are covered by release.yml,
# which runs the same checks before publishing.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate dist/
        run: python3 src/build.py

      - name: Check dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ does not match configs/. Run 'python3 src/build.py' and commit the result."
            git --no-pager diff -- dist/
            exit 1
          fi

      # Checks every rule in AGENTS.md, including that each key is one llama.cpp
      # actually accepts. An unknown key makes llama-server exit 1 at startup, so
      # this catches the same failure without needing the binary.
      - name: Validate configs
        run: python3 src/validate.py

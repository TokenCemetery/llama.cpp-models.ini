; Qwen3-VL 30B-A3B Instruct - vision, sparse MoE (3B active)
; repo: unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF
; docs: https://unsloth.ai/docs/models/tutorials/qwen3-how-to-run-and-fine-tune/qwen3-vl-how-to-run-and-fine-tune
; mmproj-*.gguf in the model directory is wired up automatically.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.

[qwen3-vl-30b-a3b-instruct]
ctx-size = 32768
n-gpu-layers = 99
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5

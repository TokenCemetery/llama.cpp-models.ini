; GLM-4.7-Flash 30B MoE (~3.6B active) - coding and agentic
; repo: unsloth/GLM-4.7-Flash-GGUF
; docs: https://unsloth.ai/docs/models/tutorials/glm-4.7-flash
; Tool calling: Z.ai suggests temp 0.7 / top-p 1.0 instead.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.

[glm-4.7-flash]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
temp = 1.0
top-p = 0.95
min-p = 0.01
repeat-penalty = 1.0

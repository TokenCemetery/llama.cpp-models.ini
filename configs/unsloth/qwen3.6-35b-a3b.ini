; Qwen3.6-35B-A3B - sparse MoE (3B active), multimodal, hybrid thinking
; repo: unsloth/Qwen3.6-35B-A3B-GGUF
; docs: https://unsloth.ai/docs/models/qwen3.6
; Qwen's Thinking-mode / general-task settings.
;   Precise coding:  temp 0.6
;   Non-thinking:    temp 0.7, top-p 0.8, presence-penalty 1.5,
;                    chat-template-kwargs = {"enable_thinking":false}
;   Preserve thinking across turns: chat-template-kwargs = {"preserve_thinking":true}
; An MTP variant (unsloth/Qwen3.6-35B-A3B-MTP-GGUF) enables speculative decoding;
; a draft file named mtp-*.gguf in the model directory is picked up automatically.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.

[qwen3.6-35b-a3b]
ctx-size = 32768
n-gpu-layers = 99
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

; Qwen3.5-35B-A3B - sparse MoE (3B active), multimodal, hybrid reasoning
; repo: unsloth/Qwen3.5-35B-A3B-GGUF
; docs: https://unsloth.ai/docs/models/qwen3.5
; Qwen's Thinking-mode / general-task settings.
;   Precise coding (e.g. WebDev):  temp 0.6, presence-penalty 0.0
;   Non-thinking:                  temp 0.7, top-p 0.8,
;                                  chat-template-kwargs = {"enable_thinking":false}
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.

[qwen3.5-35b-a3b]
n-gpu-layers = 99
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0

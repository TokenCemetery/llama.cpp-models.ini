; Magistral Small 24B (2509) - Mistral reasoning, vision
; repo: unsloth/Magistral-Small-2509-GGUF
; docs: https://unsloth.ai/docs/models/tutorials/magistral-how-to-run-and-fine-tune
; params: 24B
; tags: vision, reasoning
; mmproj-*.gguf in the model directory is wired up automatically.
; top-k = 0 disables top-k, as Mistral recommends.

[magistral-small-2509]
n-gpu-layers = 99
reasoning = on
temp = 0.7
top-p = 0.95
top-k = 0
min-p = 0.01
repeat-penalty = 1.0

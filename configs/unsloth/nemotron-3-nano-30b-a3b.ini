; NVIDIA Nemotron 3 Nano 30B-A3B - hybrid reasoning MoE (3B active)
; repo: unsloth/Nemotron-3-Nano-30B-A3B-GGUF
; docs: https://unsloth.ai/docs/models/nemotron-3
; Instruct mode instead uses temp 1.0 / top-p 1.0.
; MoE: if it will not fit, add n-cpu-moe to push experts to system RAM.

[nemotron-3-nano-30b-a3b]
n-gpu-layers = 99
reasoning = on
temp = 0.6
top-p = 0.95
min-p = 0.01

; Gemma 3 12B - text + vision, 128K context
; repo: unsloth/gemma-3-12b-it-GGUF
; docs: https://unsloth.ai/docs/models/tutorials/gemma-3-how-to-run-and-fine-tune
; mmproj-*.gguf in the model directory is wired up automatically.

[gemma-3-12b-it]
ctx-size = 32768
n-gpu-layers = 99
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
repeat-penalty = 1.0
